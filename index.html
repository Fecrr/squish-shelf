<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Squish 3D squishies on the shelf, or destroy them in the Destroy the Squishy room.">
<meta name="theme-color" content="#efe8f6">
<title>Squish Shelf</title>
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Creepster&family=DM+Mono:wght@400;500&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D stage, brand + stats float on top, one soft "squishy" control panel docked bottom-left (full width on phones). */
:root {
  --bg: #efe8f6;
  --scene: #efe8f6;
  --pedestal: #fbf8fe;
  --ink: #2a2140;
  --muted: #6e6487;
  --line: #ddd2ec;
  --panel: rgba(255, 255, 255, 0.74);
  --panel-solid: #ffffff;
  --chip: #f7f2fc;
  --accent: #ff6b8f;
  --accent-ink: #ffffff;
  --accent-soft: #ffc2d1;
  --shadow: rgba(72, 48, 110, 0.12);
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1626; --scene: #1a1626; --pedestal: #2b2440; --ink: #f4effc; --muted: #a99fc2;
    --line: #3a3152; --panel: rgba(36, 30, 54, 0.8); --panel-solid: #241e36; --chip: #2c2542;
    --accent: #ff86a5; --accent-ink: #2a0f1a; --accent-soft: #6b2c41; --shadow: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1626; --scene: #1a1626; --pedestal: #2b2440; --ink: #f4effc; --muted: #a99fc2;
  --line: #3a3152; --panel: rgba(36, 30, 54, 0.8); --panel-solid: #241e36; --chip: #2c2542;
  --accent: #ff86a5; --accent-ink: #2a0f1a; --accent-soft: #6b2c41; --shadow: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; cursor: grab; outline: none;
}
#stage.squishing { cursor: grabbing; }

.top {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; flex-wrap: wrap; pointer-events: none;
}
.top > * { pointer-events: auto; }
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(30px, 5vw, 46px); line-height: 1; margin: 0;
  letter-spacing: 0.01em; color: var(--ink);
  text-shadow: 0 2px 0 var(--accent-soft);
  text-wrap: balance;
}
.brand p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; max-width: 30ch; }
.stats { display: flex; gap: 8px; align-items: center; }
.pill {
  font-family: var(--mono); font-size: 12px; line-height: 1;
  padding: 9px 13px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
button { font: inherit; color: inherit; }
button.pill { cursor: pointer; transition: transform .3s cubic-bezier(.3, 1.7, .5, 1); }
button.pill:active { transform: scale(1.08, .86); }

.hint {
  position: fixed; margin: 0; transform: translateX(-50%);
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line);
  padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  pointer-events: none; transition: opacity .6s ease;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.hint.gone { opacity: 0; }

.panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100% - 32px));
  box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 28px; padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 40px var(--shadow);
}
.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.type {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px 9px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  font: 600 13px var(--body); cursor: pointer;
  transition: transform .35s cubic-bezier(.3, 1.7, .5, 1), background-color .2s, color .2s;
}
.type:active { transform: scale(1.07, .86); }
.type[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.type svg { width: 38px; height: 26px; display: block; }
.type svg * { fill: currentColor; }

.row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; min-width: 0; }
h2 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.1; margin: 0; min-width: 0; text-wrap: balance; }
.toggle {
  flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  padding: 7px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--chip);
  transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
}
.toggle:active { transform: scale(1.08, .86); }
.toggle[aria-pressed="true"] { border-color: var(--ink); }

.swatches { display: flex; flex-wrap: wrap; gap: 9px; padding: 0 4px; }
.sw {
  width: 34px; height: 34px; padding: 0; border-radius: 50%;
  border: 3px solid var(--panel-solid); box-shadow: 0 0 0 1px var(--line);
  cursor: pointer; transition: transform .35s cubic-bezier(.3, 1.7, .5, 1), box-shadow .2s;
}
.sw:hover { transform: scale(1.08); }
.sw:active { transform: scale(1.18, .82); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

.specs {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
  margin: 0; padding: 11px 4px 2px; border-top: 1px dashed var(--line);
}
.specs dt { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.specs dd { margin: 3px 0 0; font: 600 13px var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.grip { display: flex; gap: 8px; align-items: stretch; padding: 0 4px; }
.seg { display: flex; flex: none; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font: 600 12px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.squeeze {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 999px;
  border: 2px dashed var(--accent); background: transparent; color: var(--ink);
  font: 700 13px var(--body); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform .35s cubic-bezier(.3, 1.7, .5, 1), background-color .2s, color .2s;
}
.squeeze[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-style: solid; transform: scale(1.05, .88); }

.sndrow { display: flex; align-items: center; gap: 10px; padding: 0 4px; min-width: 0; }
.sndlabel { flex: none; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.seg.snd { flex: 1; min-width: 0; }
.seg.snd button { flex: 1; min-width: 0; padding: 6px 4px; }

#tips { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tip {
  position: absolute; left: 0; top: 0; border-radius: 50%;
  background: radial-gradient(circle at 42% 36%, rgba(255, 255, 255, .5), rgba(255, 238, 230, .22) 58%, rgba(255, 255, 255, 0) 72%);
  border: 2px solid rgba(255, 255, 255, .75);
  box-shadow: 0 6px 18px rgba(60, 30, 80, .18);
}
.tip.palm { border-radius: 46% 46% 50% 50% / 40% 40% 60% 60%; }
.tip.behind { opacity: .35; border-style: dashed; box-shadow: none; }

[hidden] { display: none !important; }
.go-hc { cursor: pointer; font: 400 15px "Creepster", "Chiller", fantasy, var(--display); letter-spacing: 0.06em; color: #f2e6e3; background: #7a0c16; border-color: #3b0509; box-shadow: 0 0 14px rgba(200, 20, 35, 0.35); }
.hc {
  --hc-bg: #0a0607; --hc-ink: #e9dcd6; --hc-muted: #8f7a74; --hc-panel: rgba(14, 7, 8, 0.86);
  --hc-line: #3b1418; --hc-hot: #b3121f; --hc-on-hot: #fff1ee; --hc-ok: #7fa35a; --hc-warn: #c9861c;
  --hc-scary: "Creepster", "Chiller", fantasy, var(--display);
  --hc-flash-gun: #fff3d6; --hc-flash-boom: #ff9a3c;
  --hc-blood: #e01b2f; --hc-blood-dark: #4a0710; --hc-blood-glow: rgba(255, 30, 50, 0.45);
  position: fixed; inset: 0; pointer-events: none; color: var(--hc-ink); font-family: var(--body);
}
/* dark vignette with a faint blood tint at the edges */
.hc::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.55) 78%, rgba(40, 0, 4, 0.85) 100%);
}
.hc-top {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap;
}
.hc-left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.hc-right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.hc-left > *, .hc-right > * { pointer-events: auto; }
.hc-btn {
  font: 400 16px var(--hc-scary); letter-spacing: 0.06em; color: var(--hc-ink); background: var(--hc-panel);
  border: 1px solid var(--hc-line); border-radius: 6px; padding: 8px 14px; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .3s cubic-bezier(.3, 1.7, .5, 1);
}
.hc-btn:active { transform: scale(1.06, .88); }
.hc-new { background: var(--hc-hot); color: var(--hc-on-hot); border-color: var(--hc-blood-dark); box-shadow: 0 0 18px var(--hc-blood-glow); }
.hc-new.pulse { animation: hcpulse 1s ease-in-out infinite; }
.hc-new:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
@keyframes hcpulse { 50% { transform: scale(1.08); } }
.hc-h {
  font-family: "Creepster", "Chiller", "Papyrus", fantasy, var(--display);
  font-weight: 400; font-size: clamp(32px, 5.5vw, 56px); line-height: 0.95; margin: 0;
  letter-spacing: 0.04em; color: var(--hc-blood); max-width: 12ch; text-wrap: balance;
  text-shadow: 0 0 1px var(--hc-blood-dark), 0 2px 0 var(--hc-blood-dark), 0 4px 0 var(--hc-blood-dark), 0 0 18px var(--hc-blood-glow), 0 0 42px var(--hc-blood-glow);
  animation: hcflicker 6s infinite steps(1);
}
@keyframes hcflicker { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .7; } 97% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hc-h { animation: none; } }
.hc-status {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px;
  background: var(--hc-panel); border: 1px solid var(--hc-line); font: 500 12px var(--mono);
  font-variant-numeric: tabular-nums; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
#hc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.hc-meter { width: 120px; height: 8px; border-radius: 2px; background: var(--hc-line); overflow: hidden; }
.hc-meter i { display: block; height: 100%; width: 100%; border-radius: inherit; background: var(--hc-ok); transition: width .15s; }
.hc-meter i[data-level="warn"] { background: var(--hc-warn); }
.hc-meter i[data-level="bad"] { background: var(--hc-hot); }
.hc-types { display: flex; padding: 3px; border-radius: 6px; background: var(--hc-panel); border: 1px solid var(--hc-line); }
.hc-types button { border: 0; background: transparent; color: var(--hc-muted); font: 400 15px var(--hc-scary); letter-spacing: 0.06em; padding: 6px 11px; border-radius: 4px; cursor: pointer; }
.hc-types button[aria-pressed="true"] { background: var(--hc-hot); color: var(--hc-on-hot); }
.hc-dock {
  position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.hc-hint { margin: 0; max-width: 100%; text-align: center; font: 500 12px var(--mono); color: var(--hc-muted); background: var(--hc-panel); border: 1px solid var(--hc-line); border-radius: 6px; padding: 7px 14px; }
.hc-tools {
  pointer-events: auto; display: flex; gap: 4px; padding: 6px; max-width: 100%; overflow-x: auto;
  background: var(--hc-panel); border: 1px solid var(--hc-line); border-radius: 10px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); scrollbar-width: none;
}
.hc-tool {
  position: relative; flex: none; width: 66px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 0; border-radius: 6px; background: transparent; color: var(--hc-ink); font: 400 14px var(--hc-scary); letter-spacing: 0.05em; cursor: pointer;
  transition: transform .3s cubic-bezier(.3, 1.7, .5, 1), background-color .15s;
}
.hc-tool:hover { background: var(--hc-line); }
.hc-tool:active { transform: scale(1.08, .86); }
.hc-tool svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hc-tool kbd { position: absolute; top: 4px; right: 7px; font: 500 9px var(--mono); color: var(--hc-muted); }
.hc-tool[aria-pressed="true"] { background: var(--hc-hot); color: var(--hc-on-hot); box-shadow: inset 0 -3px 0 var(--hc-blood-dark), 0 0 16px var(--hc-blood-glow); }
.hc-tool[aria-pressed="true"] kbd { color: var(--hc-on-hot); opacity: .75; }
#hc-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: var(--hc-flash-gun); mix-blend-mode: screen; }
#hc-flash[data-kind="boom"] { background: var(--hc-flash-boom); }
#stage.hc-canvas { cursor: crosshair; }
#stage.hc-canvas[data-tool="throw"] { cursor: grab; }
#stage.hc-canvas.grabbing { cursor: grabbing; }
@media (max-width: 700px) {
  .hc-tool { width: 56px; height: 56px; font-size: 12px; }
  .hc-meter { width: 80px; }
}

/* ---------- touch + small screens ---------- */
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.top, .panel, .hint, .hc-top, .hc-dock { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.panel { overscroll-behavior: contain; }
@media (max-width: 700px) {
  h1 { font-size: 30px; }
  .brand p { display: none; }
  .top { gap: 8px; }
  .stats { width: 100%; flex-wrap: wrap; gap: 6px; }
  .pill { padding: 8px 11px; font-size: 11px; }
  .panel { right: max(16px, env(safe-area-inset-right, 0px)); width: auto; border-radius: 24px; padding: 12px; max-height: min(50vh, 420px); overflow-y: auto; gap: 9px; }
  .type { padding: 8px 4px 7px; font-size: 12px; }
  .types { gap: 6px; }
  .type svg { width: 32px; height: 20px; }
  h2 { font-size: 19px; }
  .swatches { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px 4px 4px; }
  .swatches::-webkit-scrollbar { display: none; }
  .sw { flex: none; }
  .seg button { padding: 7px 10px; }
  .specs { padding-top: 8px; }
  .hint { font-size: 11px; padding: 7px 12px; }

  .hc-top { flex-direction: column; align-items: stretch; gap: 8px; }
  .hc-left { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 10px; }
  .hc-back .lbl { display: none; }
  .hc-h { font-size: clamp(22px, 7.4vw, 30px); white-space: nowrap; max-width: none; }
  .hc-status { grid-column: 1 / -1; justify-content: space-between; }
  .hc-status #hc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hc-meter { flex: 1; width: auto; min-width: 50px; }
  .hc-right { justify-content: flex-start; gap: 6px; }
  .hc-btn { font-size: 15px; padding: 7px 11px; }
  .hc-types button { font-size: 15px; padding: 5px 10px; }
  .hc-hint { font-size: 11px; padding: 6px 10px; }
  .hc-tools { scroll-snap-type: x mandatory; }
  .hc-tool { scroll-snap-align: start; }
}
/* phones held sideways: panel down the left, everything else on the right */
@media (max-height: 520px) and (min-width: 560px) {
  h1 { font-size: 26px; }
  .brand p { display: none; }
  .panel {
    top: calc(env(safe-area-inset-top, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    left: max(10px, env(safe-area-inset-left, 0px)); right: auto; width: min(340px, 44vw); max-height: none;
    overflow-y: auto; gap: 8px; padding: 10px; border-radius: 20px;
  }
  .top { left: calc(max(10px, env(safe-area-inset-left, 0px)) + min(340px, 44vw) + 14px); top: calc(env(safe-area-inset-top, 0px) + 10px); }
  .stats { flex-wrap: wrap; justify-content: flex-end; }
  .pill { padding: 7px 10px; font-size: 11px; }
  .type { padding: 6px 4px; font-size: 12px; } .type svg { width: 30px; height: 18px; }
  .swatches { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .sw { flex: none; width: 30px; height: 30px; }

  .hc-top { flex-wrap: nowrap; top: calc(env(safe-area-inset-top, 0px) + 8px); }
  .hc-left { gap: 6px; }
  .hc-h { font-size: 26px; white-space: nowrap; max-width: none; }
  .hc-back .lbl { display: none; }
  .hc-status { padding: 6px 10px; }
  .hc-btn { font-size: 14px; padding: 6px 10px; }
  .hc-types button { font-size: 14px; padding: 4px 8px; }
  .hc-hint { display: none; }
  .hc-dock { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .hc-tool { width: 54px; height: 50px; font-size: 12px; gap: 2px; }
  .hc-tool svg { width: 22px; height: 22px; }
}

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>


<canvas id="stage" tabindex="0" aria-label="3D squishy. Press and hold on it to squeeze, drag the empty space to spin. Space bar squeezes it with both hands."></canvas>

<header class="top">
  <div class="brand">
    <h1>Squish Shelf</h1>
    <p>Pick a squishy, then press and hold to squeeze it.</p>
  </div>
  <div class="stats">
    <button class="pill go-hc" id="go-hc" type="button">Destroy the Squishy</button>
    <span class="pill" id="count" aria-live="polite">0 squishes</span>
    <button class="pill" id="sound" type="button" aria-pressed="true">Sound on</button>
  </div>
</header>

<div id="tips" aria-hidden="true"></div>
<p class="hint" id="hint">Hold to squish · drag empty space to spin</p>

<section class="panel" id="panel" aria-label="Choose a squishy">
  <div class="types" role="tablist" aria-label="Squishy type">
    <button class="type" id="t-bao" type="button" role="tab" data-type="bao" aria-selected="true">
      <svg viewBox="0 0 38 26" aria-hidden="true"><path d="M5 17 C5 6 12 2 19 2 C26 2 33 6 33 17 Z"/><rect x="4" y="17" width="30" height="8" rx="2" opacity=".55"/></svg>
      Bao bun
    </button>
    <button class="type" id="t-butter" type="button" role="tab" data-type="butter" aria-selected="false">
      <svg viewBox="0 0 38 26" aria-hidden="true"><rect x="2" y="8" width="34" height="13" rx="4"/></svg>

  for (const st of hcList) { loadCtx(st); stepOne(dt); }
  saveCtx();
  bumpSquishies();
  for (const h of hc.halves) { if (h.owner) loadCtx(h.owner); rigidStep(h, dt, false); h.worldPlane.copy(h.localPlane).applyMatrix4(h.mesh.matrixWorld); }
  // the status bar shows whichever squishy you touched last
  if (!hcList.includes(hcFocus)) hcFocus = hcList.find((x) => !x.dead) || hcList[hcList.length - 1] || null;
  if (hcFocus) loadCtx(hcFocus);
  stepParticles(dt);
  stepSmoke(dt);
  stepSmolder(dt);
  hcBoomLight.intensity *= Math.exp(-dt * 7);
  if (!reduced) {
    if (hc.flick > 0) { hc.flick -= dt; hcKey.intensity = Math.random() < 0.5 ? 0.25 : 1.35; }
    else { hcKey.intensity = 1.35; if (Math.random() < dt * 0.25) hc.flick = rnd(0.15, 0.5); }
  }
  hc.shake *= Math.exp(-dt * 6); hc.flash *= Math.exp(-dt * 9);
  hcCam.position.copy(hcCamBase).add(randUnit(_v).multiplyScalar(hc.shake * 0.25));
  hcCam.lookAt(hcLook);
  const fx = $('#hc-flash'); fx.style.opacity = hc.flash.toFixed(3); fx.dataset.kind = hc.flashCol || 'gun';
  const pct = Math.max(0, Math.round(hc.integ / hc.max * 100));
  const txt = hc.dead ? (hc.split ? 'Split in half' : 'Popped') : `${pct}%${hc.holes.some((h) => h.leak) && hc.fill > 0.02 ? ' · leaking' : ''}`;
  if (txt !== hcLastUI) {
    hcLastUI = txt; $('#hc-pct').textContent = txt;
    const f = $('#hc-fill'); f.style.width = (hc.dead ? 0 : pct) + '%';
    f.dataset.level = pct > 60 ? 'ok' : pct > 30 ? 'warn' : 'bad';
    $('#hc-new').classList.toggle('pulse', hcList.every((x) => x.dead));
    hcRenderUI();
  }
  renderer.render(hcScene, hcCam);
}

/* ---- sounds ---- */
function sfx(fn) { const a = audio(); if (!a) return; const t = a.currentTime + 0.005; const bus = a.createGain(); out(bus); fn(a, t, bus); }
function tone(a, b, t, f0, f1, len, gain, type = 'sine') { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.connect(g).connect(b); o.start(t); o.stop(t + len + 0.02); }
const sGun = (big) => sfx((a, t, b) => { noiseBurst(a, b, t, big ? 0.55 : 0.3, 'lowpass', big ? 5200 : 7000, big ? 260 : 500, 0.7, big ? 1.3 : 0.95, 0.002); noiseBurst(a, b, t, 0.05, 'highpass', 3500, 2500, 0.7, 0.7, 0.001); tone(a, b, t, big ? 95 : 130, 35, 0.3, big ? 0.9 : 0.6); });
const sThud = (k = 1) => sfx((a, t, b) => { tone(a, b, t, 85, 32, 0.35, 0.9 * k); noiseBurst(a, b, t, 0.25, 'lowpass', 700, 150, 0.8, 0.7 * k, 0.003); grains(a, b, t + 0.02, SOUND[hc.type], 18, 0.25); });
const sChop = () => sfx((a, t, b) => { noiseBurst(a, b, t, 0.14, 'bandpass', 300, 1800, 1, 0.35, 0.06); noiseBurst(a, b, t + 0.12, 0.09, 'bandpass', 1900, 800, 2, 0.9, 0.001); tone(a, b, t + 0.12, 240, 110, 0.12, 0.5, 'triangle'); noiseBurst(a, b, t + 0.14, 0.3, 'bandpass', 800, 260, 2.5, 0.6, 0.02); });
const sPop = () => sfx((a, t, b) => { noiseBurst(a, b, t, 0.7, 'lowpass', 2600, 140, 0.8, 1.1, 0.002); tone(a, b, t, 120, 40, 0.5, 0.9); for (let i = 0; i < 14; i++) pop(a, b, t + Math.random() * 0.5, 300 + Math.random() * 900, 0.08 + Math.random() * 0.1); grains(a, b, t + 0.05, SOUND[hc.type], 40, 0.9); });
const sSplat = (sp) => sfx((a, t, b) => { const k = Math.min(1, sp / 14); noiseBurst(a, b, t, 0.28, 'bandpass', 950, 240, 1.6, 0.4 + 0.6 * k, 0.004); tone(a, b, t, 110, 45, 0.2, 0.5 * k); for (let i = 0; i < 4; i++) pop(a, b, t + Math.random() * 0.2, 300 + Math.random() * 600, 0.06); });
const sHiss = () => sfx((a, t, b) => { noiseBurst(a, b, t, 1.6, 'highpass', 3800, 3000, 0.7, 0.2, 0.05); });
const sFuse = () => sfx((a, t, b) => { noiseBurst(a, b, t, 1.7, 'highpass', 5200, 4200, 0.8, 0.14, 0.03); });
const sLaunch = () => sfx((a, t, b) => { noiseBurst(a, b, t, 0.9, 'bandpass', 500, 2400, 0.8, 0.9, 0.01); tone(a, b, t, 70, 40, 0.4, 0.6); });
const sBoom = () => sfx((a, t, b) => { noiseBurst(a, b, t, 1.6, 'lowpass', 3200, 90, 0.7, 1.5, 0.002); tone(a, b, t, 60, 22, 1.2, 1.1); noiseBurst(a, b, t + 0.05, 1.2, 'bandpass', 1500, 300, 0.6, 0.4, 0.05); });
const sPlip = () => sfx((a, t, b) => { pop(a, b, t, 380, 0.12); noiseBurst(a, b, t, 0.2, 'bandpass', 700, 300, 3, 0.25, 0.01); });

/* ---- UI ---- */
const hcEl = $('#hc');
function hcRenderUI() {
  document.querySelectorAll('.hc-tool').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === hc.tool)));
  document.querySelectorAll('.hc-types button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.type === hc.addType)));
  const nb = $('#hc-new');
  nb.textContent = `Add ${hc.addType === 'butter' ? 'butter' : hc.addType === 'jelly' ? 'jelly' : 'bao'}`;
  $('#hc-hint').textContent = HINTS[hc.tool];
  $('#hc-name').textContent = hcPreset().name;
  $('#hc-sound').textContent = state.sound ? 'Sound on' : 'Sound off';
  canvas.dataset.tool = hc.tool;
  hcLastUI = '';
}
function setTool(t) { hc.tool = t; hc.fire = false; hcRenderUI(); }
document.querySelectorAll('.hc-tool').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.querySelectorAll('.hc-types button').forEach((b) => b.addEventListener('click', () => { hc.addType = b.dataset.type; hcRenderUI(); }));
$('#hc-new').addEventListener('click', () => { hcAdd(hc.addType); squishSound(hc.addType); });
$('#hc-clean').addEventListener('click', clearSplats);
$('#hc-back').addEventListener('click', exitHC);
$('#go-hc').addEventListener('click', enterHC);
$('#hc-sound').addEventListener('click', () => { state.sound = !state.sound; store.set('sound', state.sound); hcRenderUI(); renderPanel(); });

function hcFit() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  hcCam.aspect = w / h;
  const portrait = hcCam.aspect < 0.85;
  hcCam.fov = portrait ? 52 : 42;
  const k = Math.max(1, 1.1 / hcCam.aspect);
  hcCamBase.set(0, 3.8 + (k - 1) * 0.8, 11.5 * Math.min(k, portrait ? 1.12 : 2.2) * (h < 520 ? 1.25 : 1));
  // keep the squishy centred in the free space between the top controls and the weapon bar
  const topEl = document.querySelector('.hc-top'), dockEl = document.querySelector('.hc-dock');
  const tb = topEl ? topEl.getBoundingClientRect().bottom : 0, db = dockEl ? dockEl.getBoundingClientRect().top : h;
  // on wide screens the title block sits in the top-left corner, so only the right-hand buttons limit the room's height
  const rightEl = document.querySelector('.hc-right');
  const roomTop = w >= 700 && h >= 520 && rightEl ? rightEl.getBoundingClientRect().bottom : tb;
  const shift = db > tb ? h / 2 - (tb + db) / 2 : 0;
  if (Math.abs(shift) > 1) hcCam.setViewOffset(w, h, 0, -shift, w, h); else hcCam.clearViewOffset();
  hcCam.updateProjectionMatrix();
  fitRoom(roomTop, db);
  pMat.uniforms.uScale.value = renderer.getPixelRatio() * h * 1.3;
}
new ResizeObserver(() => { if (view === 'hc') hcFit(); }).observe(document.querySelector('.hc-top'));
function enterHC() {
  releaseAll(); view = 'hc';
  top.hidden = true; panel.hidden = true; hint.hidden = true; tipsEl.hidden = true; hcEl.hidden = false;
  canvas.classList.add('hc-canvas');
  renderer.localClippingEnabled = true;
  if (!hc.addType) hc.addType = state.type;
  if (!hcList.length) hcAdd(hc.addType);
  hcRenderUI(); hcFit();
}
function exitHC() {
  view = 'shelf'; hc.fire = false; fireLoop(false); if (hc.grab) hcRelease();
  top.hidden = false; panel.hidden = false; hint.hidden = false; tipsEl.hidden = false; hcEl.hidden = true;
  canvas.classList.remove('hc-canvas', 'grabbing');
  fit();
}
function hcPtr(e) { const r = canvas.getBoundingClientRect(); hc.ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1; hc.ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1; }
function hcDown(e) {
  audio();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  hcPtr(e); aim();
  const T = hcTargets(), hit = T.length ? ray.intersectObjects(T, false)[0] : null;
  switch (hc.tool) {
    case 'pin': if (hit) pin(hit); break;
    case 'pistol': firePistol(); break;
    case 'shotgun': fireShotgun(); break;
    case 'bazooka': fireBazooka(); break;
    case 'hammer': if (hit) hammer(hit); else sThud(0.4); break;
    case 'axe': if (hit) axe(hit); break;
    case 'flame': hc.fire = true; break;
    case 'throw': if (hit) grab(hit); break;
    case 'cracker': if (hit) plantCracker(hit); break;
  }
}
function hcMove(e) {
  hcPtr(e);
  if (hc.grab) { aim(); const p = ray.ray.intersectPlane(grabPlane, new V3()); if (p) hc.grabTarget = p.sub(grabOff); }
}
function hcUp() { hc.fire = false; if (hc.grab) hcRelease(); }
addEventListener('keydown', (e) => {
  if (view !== 'hc' || (e.target.closest && e.target.closest('input'))) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= TOOLS.length) setTool(TOOLS[n - 1]);
  else if (e.key === 'r' || e.key === 'R') hcResetRoom(hc.addType);
  else if (e.key === 'Escape') exitHC();
});

/* ---------- boot ---------- */
(async () => {
  try { await Promise.race([document.fonts.load('800 100px Figtree'), new Promise((r) => setTimeout(r, 1500))]); } catch {}
  Object.keys(TYPES).forEach(applyPreset);
  renderCount(); renderPanel(); fit();
  if (location.hash === '#hardcore') enterHC();
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
